team:
  name: "ChakraView"                             # REQUIRED — e.g., "Orion Squad"
  track: "AI"                            # REQUIRED — one of: AI | DevOps | Sustainability | Open
  lead:
    name: "Devashree Nayak"                           # REQUIRED — e.g., "Alice Chen"
    email: "devashreenayak015@gmail.com"                          # REQUIRED — e.g., "alice.chen@ibm.com"
  members: []

submission:
  title: "ChakraView: Cyber Fraud Network Analyzer"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    In FY2023, organized cybercrime syndicates like the Jamtara SIM-swap ring executed over 95,000 UPI fraud cases, leaving behind massive volumes of unsolved investigations. Cyber cells spend weeks manually tracing fragmented connections across bank accounts, SIM cards, and hardware devices using flat spreadsheets, creating a massive delay that prevents suspect apprehension.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    ChakraView is an automated, graph-intelligence forensics workspace that ingests unstructured cyber fraud intelligence inputs (mock transaction logs, CDR profiles, device IDs, and accused indices). The engine parses cross-channel relationships to visually chart the organizational hierarchy from kingpins to front-line mules and victims, instantly outputting standardized, court-ready FIR case briefs with recommended enforcement actions.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Automated structural entity resolution across unformatted banking ledgers, call detail records (CDRs), and hardware fingerprints."
    - "Dynamic multi-layered relationship graphing that charts the structural network footprint from kingpins to money mules and victims."
    - "Algorithmic topology profiling that identifies fraud pattern types and isolates the central controlling infrastructure axis."
    - "Automated production of standardized, legally aligned FIR case briefs complete with specific actionable enforcement recommendations."

  tech_stack:
    languages: ["TypeScript", "SQL"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["React", "Tailwind CSS", "Vite"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["Supabase", "PostgreSQL"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["GitHub Actions", "Lucide React"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Successfully mapping complex, unformatted text strings into structural directed relational database links within Supabase, taking the real-world operational bottleneck of tracking a multi-state SIM-swap syndicate and optimizing it into a single-second automated visual triage dashboard.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    The analytics layer is explicitly designed for batch file data parsing configurations uploaded directly by investigators, lacking real-time webhook connections to live commercial banking transaction network streams.

